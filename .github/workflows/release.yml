# One-click release: Actions → Release → Run workflow.
# Tests the server, then builds the Mac app and/or the Keenetic router binary and publishes
# them as a GitHub Release. It uses only the built-in GITHUB_TOKEN, so no secrets are needed.
# How it works, and what to do when a run fails: docs/development.md#releases-github-actions
name: Release
run-name: Release (${{ inputs.version || inputs.bump }}, ${{ inputs.platforms }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Raise the last released version: patch for fixes (0.2.2 → 0.2.3), minor for new features (→ 0.3.0), major (→ 1.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or enter an exact version instead, e.g. 0.3.0. Leave empty to use the choice above.
        required: false
        type: string
      platforms:
        description: "What to build: the Mac app (Apple Silicon .dmg), the Keenetic router binary, or both."
        type: choice
        options: [macOS, macOS and Keenetic, Keenetic]
        default: macOS

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks from docs/development.md#tests, plus the streaming, Lampa and TV access tests
  # against a local BitTorrent peer. Nothing is committed or built for release if they fail.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # The app's workspace, and the vendored engine's for its own tests.
          workspaces: |
            .
            vendor/rqbit

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/release.py
      - run: node tests/peer-rates.cjs
      # THIRD_PARTY_NOTICES.txt must list the crates Cargo.lock now links into the server.
      # The version must match CARGO_ABOUT in scripts/notices.py.
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - run: python3 scripts/notices.py --check
      # The vendored engine's own unit tests, with its lockfile and the features the app uses.
      - run: cargo test --locked -p librqbit --no-default-features --features rust-tls,disable-upload --lib
        working-directory: vendor/rqbit
      - run: cargo build --locked
      - run: python3 tests/e2e.py --binary target/debug/torrstream-lite --size-mib 32 --corrupt-first
      # Adds a peer that stops answering, like one that chokes the engine mid-piece.
      - run: python3 tests/e2e.py --binary target/debug/torrstream-lite --size-mib 32 --stalling-peer --report test-results/stalling-peer.json
      # Twelve speed-limited peers, which must all send at once.
      - run: python3 tests/e2e.py --binary target/debug/torrstream-lite --cache-mib 16 --size-mib 48 --peers 12 --peer-mbps 10 --report test-results/many-peers.json
      - run: python3 tests/lampa.py --binary target/debug/torrstream-lite
      # Uses the runner's private network address, like a TV on a home network.
      - run: python3 tests/network.py --binary target/debug/torrstream-lite

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Works out the version and creates a draft release. Nothing is committed until Publish,
  # so a failed build leaves main as it was.
  prepare:
    name: Prepare
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Run the release from main, not $REF."
            exit 1
          fi

      - name: Choose platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          macos='{"name": "macOS", "platform": "macos", "os": "macos-15"}'
          keenetic='{"name": "Keenetic", "platform": "keenetic", "os": "ubuntu-latest"}'
          case "$PLATFORMS" in
            macOS) matrix="[$macos]" ;;
            Keenetic) matrix="[$keenetic]" ;;
            *) matrix="[$macos, $keenetic]" ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Set version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          next=$(python3 scripts/release.py next --bump "$BUMP" --version "$EXACT")
          echo "$next" >> "$GITHUB_OUTPUT"
          version=$(echo "$next" | sed -n 's/^version=//p')
          last=$(echo "$next" | sed -n 's/^last=//p')
          # The same changes as Publish commits, here only to check them and read the notes.
          # After a run that committed but didn't publish, main already has them.
          python3 scripts/release.py set "$version"
          # CHANGELOG.md's Unreleased notes become this version's.
          python3 scripts/release.py changelog "$version" > "$RUNNER_TEMP/notes.md"
          if ! grep -q . "$RUNNER_TEMP/notes.md"; then
            echo "::warning::CHANGELOG.md has nothing under Unreleased, so this release has no What's new."
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version** (last release: $last)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create draft release
        id: release
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PLATFORMS: ${{ inputs.platforms }}
          NOTES: ${{ runner.temp }}/notes.md
        with:
          script: |
            const { TAG: tag, PLATFORMS: platforms } = process.env;
            const notes = require('fs').readFileSync(process.env.NOTES, 'utf8').trim();
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            if (releases.some((r) => r.tag_name === tag && !r.draft)) {
              core.setFailed(`${tag} is already published.`);
              return;
            }
            // A draft left behind by a failed run is replaced.
            for (const old of releases.filter((r) => r.draft && r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: old.id });
            }
            // Only mention the platforms this release has downloads for.
            const macos = platforms !== 'Keenetic';
            const keenetic = platforms !== 'macOS';
            const repo = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              ...(notes ? ["## What's new", notes, ''] : []),
              '## Download',
              ...(macos ? ['- **macOS** (Apple Silicon, macOS 12 or later): the `.dmg`'] : []),
              ...(keenetic ? [`- **Keenetic** (ARM64 router with Entware): the \`linux-arm64.tar.gz\`. Experimental, not yet tested on a router; see the [setup](${repo}/blob/main/docs/router.md)`] : []),
              '',
              'Each download has a `.sha256` checksum file next to it.',
              ...(macos ? [
                '',
                '### First launch on a Mac',
                'The app isn\'t notarized by Apple yet, so the first time macOS says it could not verify that TorrStream Lite is free of malware. To open it anyway:',
                '1. Drag TorrStream Lite to **Applications** and open it. When the message appears, click **Done**.',
                '2. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to TorrStream Lite.',
                '3. Click **Open Anyway** again and confirm with your password or Touch ID.',
                '',
                `Or run \`xattr -dr com.apple.quarantine "/Applications/TorrStream Lite.app"\` in Terminal. More in the [README](${repo}#first-launch).`,
              ] : []),
            ].join('\n');
            // Publish points it at the release commit.
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `TorrStream Lite ${tag}`,
              body,
              draft: true,
            });
            core.setOutput('id', data.id);

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # The platforms chosen in the Prepare job.
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      # The files as the release commit will have them; Publish commits them.
      - name: Set version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release.py set "$VERSION"

      - name: Build the Mac app and DMG
        if: matrix.platform == 'macos'
        run: |
          test "$(uname -m)" = arm64
          sh scripts/build-macos.sh
          codesign --verify --deep --strict "dist/TorrStream Lite.app"
          # The server inside the app must answer Lampa like the one the Test job checked.
          python3 tests/lampa.py --binary "dist/TorrStream Lite.app/Contents/Resources/torrstream-lite"
          sh scripts/package-macos.sh

      - name: Build the static Keenetic binary
        if: matrix.platform == 'keenetic'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          rustup target add aarch64-unknown-linux-musl
          python3 -m venv .build/cross
          .build/cross/bin/pip install cargo-zigbuild==0.24.1 ziglang==0.17.1
          sh scripts/build-router.sh
          file dist/torrstream-lite-linux-arm64
          file dist/torrstream-lite-linux-arm64 | grep -q 'ARM aarch64'
          file dist/torrstream-lite-linux-arm64 | grep -q 'statically linked'
          mkdir -p release-assets
          tar -czf "release-assets/TorrStream-Lite-$VERSION-linux-arm64.tar.gz" \
            LICENSE THIRD_PARTY_NOTICES.txt -C dist torrstream-lite-linux-arm64

      - name: Add checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for asset in sorted(Path('release-assets').iterdir()):
              if asset.suffix != '.sha256':
                  digest = hashlib.sha256(asset.read_bytes()).hexdigest()
                  asset.with_name(asset.name + '.sha256').write_text(f'{digest}  {asset.name}\n')
          PY

      - name: Upload to the draft release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            for (const name of fs.readdirSync('release-assets').sort()) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: Number(process.env.RELEASE_ID),
                name,
                data: fs.readFileSync(`release-assets/${name}`),
              });
            }

  # Commit and publish only when every build succeeded, so main never has a release commit
  # without a release, and a release is never half-empty.
  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Commit version change
        id: commit
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          # Whoever started the release authors its commit, through their private
          # noreply address: it counts as theirs, and no bot joins the contributors.
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          python3 scripts/release.py set "$VERSION"
          python3 scripts/release.py changelog "$VERSION" > /dev/null
          if ! git diff --quiet; then
            git config user.name "$ACTOR"
            git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
            git commit -am "Release v$VERSION"
            # Refused if main moved since the run started: the builds are of the commit before.
            if ! git push origin HEAD:main; then
              echo "::error::Couldn't push the release commit to main. If something was pushed there while the release ran, run the release again."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            // The tag is created at the release commit.
            const { data } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              target_commitish: process.env.SHA,
              draft: false,
              make_latest: 'true',
            });
            await core.summary.addRaw(`Published [${data.name}](${data.html_url})`, true).write();
