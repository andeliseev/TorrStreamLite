name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Rust and streaming tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/release.py
      - run: node tests/peer-rates.cjs
      - run: cargo build --locked
      - run: python3 tests/e2e.py --binary target/debug/torrstream-lite --size-mib 32 --corrupt-first
      - run: python3 tests/lampa.py --binary target/debug/torrstream-lite
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  macos:
    name: Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: test "$(uname -m)" = arm64
      - run: sh scripts/build-macos.sh
      - name: Verify app and Lampa requests
        run: |
          codesign --verify --deep --strict "dist/TorrStream Lite.app"
          python3 tests/lampa.py --binary "dist/TorrStream Lite.app/Contents/Resources/torrstream-lite"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
